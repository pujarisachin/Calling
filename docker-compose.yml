version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: voice-bot-backend
    ports:
      - "8000:8000"
    environment:
      APP_ENV: production
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      LOG_LEVEL: INFO
      DATABASE_URL: sqlite:///./voice_test.db
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN}
      TWILIO_FROM_NUMBER: ${TWILIO_FROM_NUMBER}
      TWILIO_STATUS_CALLBACK_URL: ${TWILIO_STATUS_CALLBACK_URL:-}
      TWILIO_ANSWER_URL: ${TWILIO_ANSWER_URL:-}
      TWILIO_INLINE_HOLD_SECONDS: ${TWILIO_INLINE_HOLD_SECONDS:-45}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: gpt-4.1-mini
      OPENAI_REALTIME_MODEL: gpt-realtime
    volumes:
      - ./backend/voice_test.db:/app/voice_test.db
    restart: unless-stopped
    networks:
      - voice-bot-net

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: voice-bot-frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: http://backend:8000
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - voice-bot-net

networks:
  voice-bot-net:
    driver: bridge
